name: Check deployed CARTO map tile

on:
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/check-carto-deploy.yml"]

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check tile URL and HTTP response without exposing the API key
        run: |
          python - <<'PY'
          import html
          import re
          import urllib.request
          import urllib.error
          frontend="https://soom-production-be127e6c.up.railway.app"
          with urllib.request.urlopen(frontend+"/",timeout=30) as f:
              page=f.read().decode()
          bundles=re.findall(r'(?:src|href)="(/assets/[^"]+\.js)"',page)
          assert bundles, "Missing frontend JS bundle"
          with urllib.request.urlopen(frontend+bundles[0],timeout=30) as f:
              js=f.read().decode()
          pivot=js.find("basemaps.cartocdn.com/rastertiles/light_all")
          assert pivot!=-1, "Expected CARTO Positron URL missing from production JS"
          fragment=js[pivot:pivot+450]
          print("CARTO_URL_PRESENT", True)
          print("VITE_ENV_STRING_UNDEFINED_NEAR_URL", "undefined" in fragment[:185])
          # Match the parameter expression in minified Vite output.
          # A plain literal key is included in a JS template expression.
          expression=re.search(r'key=\$\{([^}]+)\}',fragment)
          if expression:
              value=expression.group(1).strip()
              print("KEY_EXPRESSION_TYPE", "literal" if value.startswith(('"',"'")) else "other")
              if value.startswith(('"',"'")):
                  key=value[1:-1]
              else:
                  key=None
          else:
              plain=re.search(r'key=([^\x60"\'&\s{}]+)',fragment)
              key=plain.group(1) if plain else None
              print("KEY_EXPRESSION_TYPE","plain" if key else "missing")
          print("KEY_PRESENT",bool(key) and key!="undefined")
          if key and key!="undefined":
              url=f"https://basemaps.cartocdn.com/rastertiles/light_all/13/6986/3163.png?key={key}"
              req=urllib.request.Request(url,headers={"Referer":frontend+"/","User-Agent":"Mozilla/5.0"})
              try:
                  with urllib.request.urlopen(req,timeout=35) as response:
                      content=response.read()
                      print("TILE_STATUS",response.status)
                      print("TILE_MIME",response.headers.get("Content-Type"))
                      print("TILE_BYTES",len(content))
                      print("TILE_VALID_PNG",content[:8]==b"\x89PNG\r\n\x1a\n")
              except urllib.error.HTTPError as e:
                  print("TILE_STATUS",e.code)
                  print("TILE_ERROR_CATEGORY", "permission_or_key" if e.code in (401,403) else "other")
                  raise
          PY

# Re-run against committed Railway CARTO variable
