name: Integration checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/frontend]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint

  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q app/backend notebooks/02_preprocessing notebooks/03_modeling
      - name: Test risk model CSV and 21m decay bands
        run: python -m unittest discover -s app/backend -p "test_model_risk_integration.py" -v
      - name: Install B2G geographic test dependencies
        run: python -m pip install osmnx
      - name: Test B2G scored walking edge GeoJSON
        run: python -m unittest discover -s app/backend -p "test_b2g_cleanliness.py" -v
      - name: Test avoidance simulation path metrics
        run: python -m unittest discover -s app/backend -p "test_avoidance_simulation.py" -v
      - name: Validate Jupyter notebooks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path("notebooks").rglob("*.ipynb"):
              notebook = json.loads(path.read_text(encoding="utf-8"))
              assert notebook.get("cells") is not None, str(path)
          import ast
          for path in Path("notebooks/01_eda").glob("EDA_LOCAL_RESD_250M_*.ipynb"):
              notebook = json.loads(path.read_text(encoding="utf-8"))
              for index, cell in enumerate(notebook["cells"]):
                  if cell["cell_type"] == "code":
                      ast.parse("".join(cell["source"]), filename=f"{path}:cell{index}")
          print("Notebook JSON and population notebook Python syntax validation passed")
          PY
